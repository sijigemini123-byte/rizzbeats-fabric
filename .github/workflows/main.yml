name: Build RizzBeats JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unzip and Build JAR
        run: |
          unzip -o rizzbeats-fabric-1.21.8-1.21.11.zip
          cd rizzbeats-fabric
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: rizzbeats-fabric-jar
          path: rizzbeats-fabric/build/libs/*.jar
